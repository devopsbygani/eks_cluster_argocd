apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myplatform-root
  namespace: argocd   # ArgoCD must watch this namespace (usually argocd)
spec:
  project: default     # ArgoCD project name
  source:
    repoURL: https://github.com/devopsbygani/eks_cluster_argocd.git
    targetRevision: main  # Branch, tag, or commit
    path: applications   # Folder with Kubernetes YAMLs/Helm chart
  destination:
    server: https://kubernetes.default.svc  # Indicates in-cluster deployment
    namespace: argocd             # Namespace where app will be deployed
  syncPolicy:
    automated:           # Enable auto-sync
      prune: true        # Delete resources removed from Git
      selfHeal: true     # Revert drift in live cluster
    syncOptions:
      - CreateNamespace=true  # Auto-create target namespace if missing
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
---
# App of Apps
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd  # ArgoCD's namespace
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # Ensures children are deleted when parent is deleted
spec:
  project: default
  source:
    repoURL: https://github.com/DAWS-82S/eks-cluster-argocd.git
    targetRevision: main   # or a tag/commit hash
    path: applications        # folder in repo with Kubernetes YAMLs
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true           # delete resources not in Git
      selfHeal: true        # revert out-of-band changes
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true